<script>
loader = document.getElementById("loader")
window.onscroll = function(){document.getElementById("topBtn").style.display = document.documentElement.scrollTop>200?"block":"none";}
function scrollToTop(){document.documentElement.scrollTop=0;}

//==== Fallback link (custom domain -> GitHub Pages) ====
// If the GoDaddy-registered custom domain (see CNAME) lapses, DNS for that
// domain stops resolving entirely, so no code running on this page can
// redirect anyone away from it — that has to happen before the domain dies.
// This link is the practical mitigation: it's always visible in the menu so
// visitors can bookmark the permanent GitHub Pages URL in advance.
// >>> Replace the placeholder below with your real GitHub Pages URL <<<
const GITHUB_PAGES_FALLBACK_URL = "https://gvssmark.github.io/IbraAddBook/";
document.getElementById('fallbackLink').href = GITHUB_PAGES_FALLBACK_URL;

//==== Hamburger drawer ====
function toggleDrawer(){
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('drawerBackdrop').classList.toggle('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerBackdrop').classList.remove('open');
}

//==== Utility: Date Formatting ====
function formatDate(input) {
  const date = new Date(input);
  return isNaN(date) ? 'NA' : date.toLocaleString('en-GB');
}

//==== IndexedDB storage layer ====
const IDB_NAME = 'ibraDB';
// NOTE: never lower this number again - a browser that has already opened
// the DB at a higher version (e.g. during earlier testing) will throw
// VersionError if a page later requests a lower version. Always bump forward.
// v4 adds the 'photos' object store used to cache member images locally.
const IDB_VERSION = 4;
let idbPromise;

function openDB() {
  if (idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('addbook')) {
        const store = db.createObjectStore('addbook', { keyPath: 'id' });
        store.createIndex('area', 'area');
        store.createIndex('srno', 'srno');
        store.createIndex('name', 'name');
      }
      if (!db.objectStoreNames.contains('meta')) {
        db.createObjectStore('meta');
      }
      if (!db.objectStoreNames.contains('photos')) {
        // keyPath 'id' holds the member's photoid (Google Drive file id).
        // Re-caching happens naturally: when a member's photo changes, the
        // source data gets a new photoid, so this is just a new key - no
        // explicit invalidation step needed.
        db.createObjectStore('photos', { keyPath: 'id' });
      }
      // Note: an earlier 'photoBlobs' store may exist from prior testing;
      // unused now, harmless to leave in place.
    };
    req.onblocked = () => {
      console.error('IndexedDB upgrade blocked - close other open tabs of this app and reload.');
      reject(new Error('IndexedDB upgrade blocked by another open tab'));
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return idbPromise;
}

async function idbPutAll(storeName, items) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    store.clear();
    let skipped = 0;
    items.forEach(item => {
      try {
        store.put(item);
      } catch (err) {
        skipped++;
        console.warn(`Skipped invalid record in "${storeName}":`, item, err);
      }
    });
    if (skipped > 0) {
      console.warn(`${storeName}: skipped ${skipped} of ${items.length} record(s) due to invalid data`);
    }
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGetAll(storeName) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbSetMeta(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('meta', 'readwrite');
    tx.objectStore('meta').put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGetMeta(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('meta', 'readonly');
    const req = tx.objectStore('meta').get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbPut(storeName, item) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(item);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGet(storeName, key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbDelete(storeName, key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGetAllKeys(storeName) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAllKeys();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

//==== Photo cache (images stored in IndexedDB, keyed by photoid) ====
const photoUrlCache = new Map(); // photoid -> already-created objectURL, this session

async function getPhotoUrl(photoid) {
  if (!photoid) return null;
  if (photoUrlCache.has(photoid)) return photoUrlCache.get(photoid);

  try {
    const existing = await idbGet('photos', photoid);
    if (existing && existing.blob) {
      const url = URL.createObjectURL(existing.blob);
      photoUrlCache.set(photoid, url);
      return url;
    }
  } catch (err) {
    console.warn('Photo cache read failed:', err);
  }

  const remoteUrl = `https://drive.google.com/thumbnail?id=${photoid}`;
  try {
    const res = await fetch(remoteUrl);
    if (!res.ok) throw new Error('fetch failed: ' + res.status);
    const blob = await res.blob();
    await idbPut('photos', { id: photoid, blob, cachedAt: Date.now() });
    const url = URL.createObjectURL(blob);
    photoUrlCache.set(photoid, url);
    return url;
  } catch (err) {
    // Caching failed (offline, or the endpoint blocked a cross-origin blob
    // read) - fall back to loading it directly, same as before this change.
    console.warn('Could not cache photo locally, using direct URL:', err);
    return remoteUrl;
  }
}

// Drop cached photos that no longer belong to any current member, so old
// images don't accumulate forever in IndexedDB after a photoid changes.
async function prunePhotoCache(currentAddBookData) {
  try {
    const liveIds = new Set(currentAddBookData.map(r => r.photoid).filter(Boolean));
    const cachedKeys = await idbGetAllKeys('photos');
    const stale = cachedKeys.filter(k => !liveIds.has(k));
    for (const key of stale) {
      await idbDelete('photos', key);
    }
    if (stale.length) console.log(`Pruned ${stale.length} stale cached photo(s)`);
  } catch (err) {
    console.warn('Photo cache prune skipped:', err);
  }
}

//==== Fetch Data Functions ====
async function fetchJson(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Fetch failed: ${url}`);
  return await res.json();
}
async function fetchLatestTimestamp() {
  const url = 'https://script.google.com/macros/s/AKfycbwo-TtPn3DAjHSPCXDwPFerT36QyfPPvUTi7uQEvcmjJso_aWpaKefUsgx_vpJOowHUgg/exec?sheetid=1MaB1PMP3ouY3Es5ziLgY7dhT3ZSb6oHRgecw3JiJfGw&sheetname=Sheet1';
  const res = await fetch(url, { cache: 'no-store' });
  const text = (await res.text()).trim();
  try {
    const parsed = JSON.parse(text);
    return Array.isArray(parsed) ? parsed.flat(Infinity)[0] : parsed;
  } catch {
    return text;
  }
}
async function fetchAddBookData() {
  const url = 'https://script.google.com/macros/s/AKfycbwIVAlRrCTt6z_Ej4W6PHhopFqCq1JvEsSoN2RPqgWY7VXLW0P2pteA1jgVFaWePc2S/exec';
  let data = await fetchJson(url);
  data.shift(); // remove header
  let formatted = data.map(([id, name, add1, add2, add3, district, place, pincode, fixed, mobile1, mobile2, state, email, srno, sbac, doj, dor, spname, area, blank1, dob, fampen, pensionbr, scanned, newempid, dod, photoid, blank3, blank4]) => ({
    id: Number(id), name, add1, add2, add3, district, place, pincode, fixed, mobile1, mobile2, state, email, srno, sbac,
    doj: ddmmyy(doj), dor: ddmmyy(dor), spname, area, blank1, dob: ddmmyy(dob), fampen, pensionbr, scanned, newempid, dod: ddmmyy(dod),
    photoid, blank3, blank4
  }));
  const totalBefore = formatted.length;
  formatted = formatted.filter(r => !isNaN(r.id));
  if (formatted.length < totalBefore) {
    console.warn(`addbook: dropped ${totalBefore - formatted.length} row(s) with invalid/blank id out of ${totalBefore}`);
  }
  await idbPutAll('addbook', formatted);
  prunePhotoCache(formatted); // fire-and-forget housekeeping
  return formatted;
}

// One-time migration for users still on the old version, which stored the
// timestamp in localStorage and the actual data in the Cache API.
const LEGACY_MIGRATION_FLAG = 'migratedFromLocalStorage_v1';
const LEGACY_CACHE_NAME = 'addbook';

async function migrateLegacyStorage() {
  try {
    const alreadyMigrated = await idbGetMeta(LEGACY_MIGRATION_FLAG);
    if (alreadyMigrated) return;
  } catch (err) {
    console.warn('Could not check migration flag, proceeding cautiously:', err);
  }

  try {
    const legacyTimestamp = localStorage.getItem('data_updated_at');
    if (legacyTimestamp) {
      const existing = await idbGetMeta('data_updated_at');
      if (!existing) {
        await idbSetMeta('data_updated_at', legacyTimestamp);
        console.log('Migrated data_updated_at from localStorage to IndexedDB');
      }
      localStorage.removeItem('data_updated_at');
    }
  } catch (err) {
    console.warn('Legacy localStorage migration skipped:', err);
  }

  try {
    const existingAddbook = await idbGetAll('addbook');
    if ((!existingAddbook || !existingAddbook.length) && 'caches' in window) {
      const cache = await caches.open(LEGACY_CACHE_NAME);
      const addbookResp = await cache.match('/custom/addbookdata.json');
      if (addbookResp && addbookResp.ok) {
        const oldAddbook = await addbookResp.json();
        if (Array.isArray(oldAddbook) && oldAddbook.length) {
          const normalized = oldAddbook.map(r => ({ ...r, id: Number(r.id) })).filter(r => !isNaN(r.id));
          await idbPutAll('addbook', normalized);
          console.log('Migrated', normalized.length, 'addbook records from Cache API to IndexedDB');
        }
      }
      await caches.delete(LEGACY_CACHE_NAME);
    }
  } catch (err) {
    console.warn('Legacy Cache API migration skipped:', err);
  }

  await idbSetMeta(LEGACY_MIGRATION_FLAG, true);
}

async function initReport() {
  await migrateLegacyStorage();

  let addBookData = await idbGetAll('addbook');
  let localTimestamp = await idbGetMeta("data_updated_at");

  if (addBookData && addBookData.length && localTimestamp) {
    showReport(addBookData, "Saved & Latest", localTimestamp);
  } else {
    document.getElementById("DataLoadedFrom").textContent = "No cache, waiting for server...";
  }

  try {
    const serverTimestamp = await fetchLatestTimestamp();
    localTimestamp = await idbGetMeta("data_updated_at");

    if (!addBookData.length || localTimestamp != serverTimestamp) {
      addBookData = await fetchAddBookData();
      await idbSetMeta("data_updated_at", serverTimestamp);
      showReport(addBookData, "Server (updated)", serverTimestamp);
      showUpdateModal("📢 Latest Data Loaded ");
    }
    document.getElementById("loader").style.display = "none"
    document.getElementById("datadate").style.display = "block"
    document.getElementById("datadate").innerHTML = new Date().toLocaleString('en-GB', {timeZone: 'Asia/Kolkata'})
  } catch (err) {
    console.error("Background refresh failed", err);
    document.getElementById("loader").style.display = "none"
  }
}
initReport().catch(err => {
  console.error('initReport failed:', err);
  document.getElementById("loader").style.display = "none";
  document.getElementById("DataLoadedFrom").textContent = "Could not load data. Please reload the page.";
});

function processData(addBookData) {
  console.log(addBookData);
  let data = addBookData;

  activeMembers = data.filter(a => a.name !== "").sort((a, b) => a.name.localeCompare(b.name));
  activeMembers.forEach(element => {
    element.IBorEAB = (element.area.substr(-3).toUpperCase() === 'EAB' ? "EAB" : "IB");
    element.pentype = (element.fampen.length > 0 ? "fam" : "ser");
  });

  familyPensioners = activeMembers.filter(a => a.fampen !== "")
    .map(a => ({ id: a.id, name: a.name, fampen: a.fampen, ibeab: a.IBorEAB, photoid: a.photoid }));

  blank = activeMembers.filter(a => a.area === "BLANK")
    .map(a => ({ id: a.id, name: a.name, fampen: a.fampen, ibeab: a.IBorEAB, srno: a.srno, mobile: a.mobile1, photoid: a.photoid }));

  allMembNoWise = activeMembers.map(a => ({
    id: a.id, name: a.name, fampen: a.fampen, ibeab: a.IBorEAB,
    srno: a.srno, mobile: a.mobile1, newempid: a.newempid, photoid: a.photoid
  })).sort((a, b) => a.srno - b.srno);

  allmemb = activeMembers.map(a => ({
    id: a.id, name: a.name, fampen: a.fampen, ibeab: a.IBorEAB,
    srno: a.srno, mobile: a.mobile1, newempid: a.newempid, photoid: a.photoid
  }));

  selectedRegion('allmemb', 0);
}

    srno: a.srno, mobile: a.mobile1, newempid: a.newempid, photoid: a.photoid
  }));
  let tarr = array === 'allmemb' ? allmemb : array === 'allMembNoWise' ? allMembNoWise : tany;
  document.getElementById("myInput").value = "";
  document.getElementById("myInput").style.display = "block";
  document.documentElement.scrollTop = 0;
  closeDrawer();

  let famPensionersCount = tarr.filter(a => a.fampen.length > 0).length;

  let regions = ["All Members", "Visakhapatnam Area", "Godavari Area", "Vijayawada Area", "Seema Area", "Hyderabad Area", "Other States", "e Allahabad", "SR No Sorted"];
  document.getElementById('regionHeading').innerHTML = regions[n] +
    " <span class='badge'>" + tarr.length + "</span>" +
    "<span class='badge1'>" + famPensionersCount + "</span> " +
    "<span class='eabbadge'>" + eabcount + "</span>";

  let inThisRegion = "<table id='regionTable' border='0'><tr><td>Name / Mobile / SR No/<span class='newempid'>NewEmpId</span> / Memb No /Photo </td></tr>";

        <td class="${a.fampen.length > 0 ? "fam" : "ser"}">
          <span class="pname">${a.name}</span>
          ${a.fampen.length > 0 ? `<span class="smallbadge">&nbsp;</span><br>Family Pension of: ${a.fampen}` : ``}
          ${a.ibeab === 'EAB' ? `<span class="smalleabbadge">&nbsp;</span>` : ``}
          <br><span style='font-size:small; color:grey;'> Mobile: ${a.mobile} / SR: ${a.srno} / ${a.newempid} / Memb: ${a.id}  ${isPhoto(a.photoid)} </span>
        </td>
      </tr>`;
  });
  inThisRegion += "</table>";
  document.getElementById('paraInThisRegion').innerHTML = inThisRegion;
  window.scrollTo(0, 0);
}

//==== New member details card ====
async function nameclick(membershipNo) {
  document.getElementById("myInput").value = "";
  let membno = membershipNo * 1;
  let membData = activeMembers.filter(a => a.id === membno)[0];
  if (!membData) return;

  let ptype = membData.fampen !== "" ? "Family Pension" : "Service Pension";
  let whichBank = membData.IBorEAB === 'IB' ? "Indian Bank" : "e Allahabad Bank";

  document.getElementById("cardEyebrow").textContent = whichBank + " · " + ptype;
  document.getElementById("cardMembNo").textContent = "Membership No. " + membData.id;
  document.getElementById("nameHeader").textContent = membData.name;

  // Photo: show placeholder immediately, swap in once resolved from IndexedDB / network
  const photoEl = document.getElementById("photo");
  photoEl.innerHTML = "&#128100;";
  if (membData.photoid) {
    getPhotoUrl(membData.photoid).then(url => {
      if (url) photoEl.innerHTML = `<img src="${url}" alt="${membData.name}">`;
    });
  }

  // Badges
  let badges = "";
  badges += `<span class="pill">${membData.area.substr(0,3)} Region</span>`;
  if (membData.fampen) badges += `<span class="pill fam">Family Pension</span>`;
  if (membData.IBorEAB === 'EAB') badges += `<span class="pill eab">eAB</span>`;
  document.getElementById("cardBadges").innerHTML = badges;

  // Actions (call / whatsapp)
  let actions = "";
  if (membData.mobile1) actions += `<a class="act-btn act-call" href="tel:${membData.mobile1}">&#128222; Call</a>`;
  if (isMobileDevice && membData.mobile1) {
    let msg = encodeURIComponent(`Hi ${membData.name} 🙏`);
    actions += `<a class="act-btn act-wa" href="https://wa.me/91${membData.mobile1}?text=${msg}" target="_blank">WhatsApp</a>`;
  }
  document.getElementById("cardActions").innerHTML = actions;

  // Detail sections
  let addressLines = [membData.add1];
  if (membData.add2.length > 0) addressLines.push(membData.add2);
  if (membData.add3.length > 0) addressLines.push(membData.add3);
  if (membData.place.length > 0) addressLines.push(`${membData.place} ${membData.pincode}`);
  if (membData.district.length > 0) addressLines.push(`${membData.district} District`);

  let html = "";

  html += `<div class="card-section"><div class="card-section-title">Address</div>
    <div class="card-row"><span class="v" style="text-align:left;flex:1">${addressLines.join('<br>')}</span></div></div>`;

  html += `<div class="card-section"><div class="card-section-title">Contact</div>`;
  if (membData.fixed.length > 0) html += `<div class="card-row"><span class="k">Landline</span><span class="v">${membData.fixed}</span></div>`;
  if (membData.mobile1 > 0) html += `<div class="card-row"><span class="k">Mobile</span><span class="v"><a href="tel:${membData.mobile1}">${membData.mobile1}</a></span></div>`;
  if (membData.mobile2 > 0) html += `<div class="card-row"><span class="k">Alt. Mobile</span><span class="v">${membData.mobile2}</span></div>`;
  if (membData.email) html += `<div class="card-row"><span class="k">Email</span><span class="v">${membData.email}</span></div>`;
  html += `</div>`;

  html += `<div class="card-section"><div class="card-section-title">Employment &amp; Pension</div>
    <div class="card-row"><span class="k">S R No</span><span class="v">${membData.srno}</span></div>
    <div class="card-row"><span class="k">New Emp Id</span><span class="v">${membData.newempid}</span></div>
    <div class="card-row"><span class="k">Pension Br</span><span class="v">${membData.pensionbr}</span></div>
    <div class="card-row"><span class="k">Pension Acc</span><span class="v">${membData.sbac}</span></div>
    <div class="card-row"><span class="k">Application Scanned</span><span class="v">${membData.scanned}</span></div>
    <div class="card-row"><span class="k">DOB</span><span class="v">${membData.dob}</span></div>
    <div class="card-row"><span class="k">DOJ</span><span class="v">${membData.doj}</span></div>
    <div class="card-row"><span class="k">DOR</span><span class="v">${membData.dor}</span></div>
    <div class="card-row"><span class="k">Spouse Name</span><span class="v">${membData.spname}</span></div>
  </div>`;

  if (membData.fampen !== "") {
    html += `<div class="card-section fampen"><div class="card-section-title">Family Pension</div>
      <div class="card-row"><span class="k">Of</span><span class="v">${membData.fampen}</span></div>
      <div class="card-row"><span class="k">DOD of Ser. Pensioner</span><span class="v">${membData.dod}</span></div>
    </div>`;
  }

  document.getElementById("modalData").innerHTML = html;
  modal.style.display = "block";
}

function fiterName() {
  let input = document.getElementById("myInput");
  let filter = input.value.toUpperCase().replaceAll(" ", "");
  let table = document.getElementById("regionTable");
  let tr = table.getElementsByTagName("tr");
  for (let i = 0; i < tr.length; i++) {
    let td = tr[i].getElementsByTagName("td")[0];
    if (td) {
      let txtValue = td.textContent || td.innerText;
      if (txtValue.toUpperCase().replaceAll(" ", "").indexOf(filter) > -1) {
        tr[i].style.display = "";
      } else {
        tr[i].style.display = "none";
      }
    }
  }
}

function showUpdateModal(message) {
  const header = document.getElementById("nameHeader");
  const content = document.getElementById("modalData");

  document.getElementById("cardEyebrow").textContent = "";
  document.getElementById("cardMembNo").textContent = "";
  document.getElementById("cardBadges").innerHTML = "";
  document.getElementById("cardActions").innerHTML = "";
  header.innerHTML = "<span style='font-size:60px;display:block;text-align:center'>&#9995;</span>";
  content.innerHTML = `<p style="text-align:center;font-size:16px;">${message}</p>`;
  document.getElementById('photo').innerHTML = "";

  modal.style.display = "block";
  setTimeout(() => { modal.style.display = "none"; }, 3000);
}
