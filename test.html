<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PDF + WhatsApp Share</title>

    <!-- jsPDF -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
        crossorigin="anonymous">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            font-size: 17px;
            border: none;
            border-radius: 7px;
            background: #25D366;
            color: white;
            font-weight: bold;
        }

        button:disabled {
            background: #999;
        }

        #status {
            margin-top: 15px;
            text-align: center;
            white-space: pre-wrap;
        }

        .preview {
            margin-top: 20px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 6px;
            word-break: break-all;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Form → PDF → WhatsApp</h2>

    <form id="myForm">

        <label>Name</label>
        <input
            id="name"
            type="text"
            required
        >

        <label>Phone</label>
        <input
            id="phone"
            type="tel"
            required
        >

        <label>Amount</label>
        <input
            id="amount"
            type="number"
            required
        >

        <button
            id="shareButton"
            type="submit"
        >
            📄 Share PDF
        </button>

    </form>

    <div class="preview">
        <strong>Message:</strong>
        <div id="messagePreview"></div>
    </div>

    <div id="status"></div>

</div>


<script>

/*
 * Wait until the page has loaded.
 */
window.addEventListener("load", function () {

    const form =
        document.getElementById("myForm");

    const button =
        document.getElementById("shareButton");

    const status =
        document.getElementById("status");

    const preview =
        document.getElementById("messagePreview");


    /*
     * Verify that jsPDF actually loaded.
     */
    if (
        !window.jspdf ||
        !window.jspdf.jsPDF
    ) {

        status.textContent =
            "ERROR: jsPDF failed to load.\n\n" +
            "Check your internet connection and " +
            "make sure the jsPDF CDN is accessible.";

        button.disabled = true;

        return;
    }


    /*
     * Get form values.
     */
    function getValues() {

        return {
            name:
                document.getElementById("name")
                    .value.trim(),

            phone:
                document.getElementById("phone")
                    .value.trim(),

            amount:
                document.getElementById("amount")
                    .value.trim()
        };
    }


    /*
     * Create ^ separated message.
     *
     * Example:
     * Ravi^9876543210^5000
     */
    function createMessage() {

        const data = getValues();

        return [
            data.name,
            data.phone,
            data.amount
        ].join("^");
    }


    /*
     * Update preview.
     */
    function updatePreview() {

        preview.textContent =
            createMessage();
    }


    form.addEventListener(
        "input",
        updatePreview
    );


    /*
     * Generate PDF.
     */
    function generatePDF() {

        /*
         * IMPORTANT:
         *
         * jsPDF is inside window.jspdf
         */
        const jsPDF =
            window.jspdf.jsPDF;


        const data =
            getValues();


        const pdf =
            new jsPDF();


        /*
         * PDF title
         */
        pdf.setFontSize(20);

        pdf.text(
            "Form Details",
            20,
            25
        );


        /*
         * Separator
         */
        pdf.setLineWidth(0.5);

        pdf.line(
            20,
            30,
            190,
            30
        );


        /*
         * Data
         */
        pdf.setFontSize(12);


        pdf.text(
            "Name:",
            20,
            45
        );

        pdf.text(
            data.name,
            60,
            45
        );


        pdf.text(
            "Phone:",
            20,
            55
        );

        pdf.text(
            data.phone,
            60,
            55
        );


        pdf.text(
            "Amount:",
            20,
            65
        );

        pdf.text(
            data.amount,
            60,
            65
        );


        /*
         * Generate Blob.
         */
        return pdf.output("blob");
    }


    /*
     * Share PDF.
     */
    async function sharePDF() {

        try {

            status.textContent =
                "Generating PDF...";


            /*
             * Create message.
             */
            const message =
                createMessage();


            /*
             * Generate PDF Blob.
             */
            const pdfBlob =
                generatePDF();


            /*
             * Convert Blob → File.
             */
            const pdfFile =
                new File(
                    [pdfBlob],
                    "form-details.pdf",
                    {
                        type: "application/pdf"
                    }
                );


            /*
             * Check Web Share.
             */
            if (!navigator.share) {

                throw new Error(
                    "Web Share API is not supported " +
                    "by this browser."
                );
            }


            /*
             * Share data.
             */
            const shareData = {

                text: message,

                files: [
                    pdfFile
                ]
            };


            /*
             * Check file sharing support.
             */
            if (
                navigator.canShare &&
                !navigator.canShare(shareData)
            ) {

                throw new Error(
                    "This browser cannot share " +
                    "PDF files."
                );
            }


            status.textContent =
                "Opening share menu...";


            /*
             * IMPORTANT:
             *
             * This runs directly from the user's
             * button/form action.
             */
            await navigator.share(
                shareData
            );


            status.textContent =
                "PDF shared successfully.";


        } catch (error) {

            console.error(
                "Share error:",
                error
            );


            /*
             * User cancelled share sheet.
             */
            if (
                error.name ===
                "AbortError"
            ) {

                status.textContent =
                    "Sharing cancelled.";

                return;
            }


            status.textContent =
                "Unable to share the PDF.\n\n" +
                error.message;
        }
    }


    /*
     * Form submit.
     */
    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            await sharePDF();
        }
    );


    /*
     * Initial preview.
     */
    updatePreview();

});

</script>

</body>
</html>
